controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0

left_arm_controller:
  ros__parameters:
    joints:
      - l_post_Joint
      - l_shoulder_Joint
      - l_arm_JointA
      - l_arm_JointB
      - l_arm_JointC
      - l_wrist_p_Joint
      - l_wrist_y_Joint
      - l_wrist_r_Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true

right_arm_controller:
  ros__parameters:
    joints:
      - r_post_Joint
      - r_shoulder_Joint
      - r_arm_JointA
      - r_arm_JointB
      - r_arm_JointC
      - r_wrist_p_Joint
      - r_wrist_y_Joint
      - r_wrist_r_Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true

left_gripper_controller:
  ros__parameters:
    joints:
      - l-hand-l-finger_Joint
      - l-hand-r-finger_Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true

right_gripper_controller:
  ros__parameters:
    joints:
      - r-hand-l-finger_Joint
      - r-hand-r-finger_Joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true